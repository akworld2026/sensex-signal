name: Update Fund Data

on:
  schedule:
    # Every Monday 03:00 UTC = 8:30 AM IST — fund rankings don't shift meaningfully day to day
    - cron: '0 3 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-funds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch fund data
        run: python scripts/fetch_fund_data.py

      - name: Commit and push if funds.json changed
        run: |
          git config user.name "fund-data-bot"
          git config user.email "actions@github.com"
          git add funds.json
          git diff --cached --quiet || git commit -m "Update fund data $(date -u +'%Y-%m-%d')"
          git push
